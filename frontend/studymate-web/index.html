<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf8f4" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Inter and Fraunces carry no Arabic glyphs at all, so an Arabic
      interface on them falls back to whatever the operating system happens
      to provide and looks like a different product on every machine. IBM
      Plex Sans Arabic is the third family for that reason, at the same four
      weights, and src/index.css hands both font tokens to it under
      :root[lang="ar"].
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>StudyMate</title>

    <!--
      The theme and the language, applied before the app bundle is fetched.

      This has to run here rather than in React. The stylesheet's light
      values are the defaults, so a preference read after the app boots
      repaints a dark page from white - a flash on every single load, on
      every page. Reading it in <head> means the very first paint is
      already the right colour.

      The language is here for the same reason, only more so: `dir` mirrors
      the entire layout, so a direction read after React mounts is not a
      flash of the wrong colour but the whole page jumping from one side of
      the screen to the other. Nothing flips until the Arabic exists, and
      this is still where it has to be built.

      It is deliberately duplicated: src/lib/theme.js and src/lib/language.js
      hold the same logic for the running app. Keep the keys and the values
      in step.
    -->
    <script>
      try {
        var stored = localStorage.getItem('studymate.theme')
        var theme = stored === 'light' || stored === 'dark' ? stored : 'system'

        document.documentElement.dataset.theme =
          theme === 'system'
            ? window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
            : theme
      } catch (e) {
        /* A private window, blocked site data, or no matchMedia. The page
           renders in the stylesheet's light default, which is exactly what
           it did before this script existed. */
      }

      try {
        var storedLang = localStorage.getItem('studymate.lang')

        /* English unless Arabic was actually chosen - the same rule as
           getStoredLanguage(), and deliberately not navigator.language. */
        var lang = storedLang === 'ar' ? 'ar' : 'en'

        document.documentElement.lang = lang
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr'
      } catch (e) {
        /* Storage unavailable. The document keeps the lang="en" written on
           the <html> tag below, and its default left-to-right direction. */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
